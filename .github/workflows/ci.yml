name: CI

on:
  push: 
    branches:
      - main

jobs: 
  build: 
    name: Build and Push
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [ 20, 22, 24 ]

    steps:
      - uses: actions/checkout@v7

      - name: Setup node | ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm run test

      - name: Geração da Tag
        id: generate_tag
        run: |
          SHA=$(echo $GITHUB_SHA | head -c7)
          echo "sha=$SHA" >> $GITHUB_OUTPUT

      - name: Login into the container registrer
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t fernando2dev/ci-api:${{ steps.generate_tag.outputs.sha }} .
      
      - name: Push image
        run: docker push fernando2dev/ci-api:${{ steps.generate_tag.outputs.sha }}


      
      
