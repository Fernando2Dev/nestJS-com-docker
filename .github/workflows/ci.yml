name: CI

on:
  push: 
    branches:
      - main

jobs: 
  build: 
    name: 'Build and Push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
      - run: 'npm install' 
      
