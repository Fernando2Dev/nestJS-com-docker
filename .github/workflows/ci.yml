name: CI

on:
  push: 
    branches:
      - main

jobs: 
  build: 
    name: 'Build and Push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [ 20, 22, 24 ]

    steps:
      - uses: actions/checkout@v7

      - name: Setup node | ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      - run: 'npm install'
      - run: 'npm run test' 

      - name: Build Docker image
      - run: docker build -t ci-api:latest .
      


      
      
